name = "formula-de-impacto"
pages_build_output_dir = "out"
compatibility_date = "2026-09-01"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "formula-de-impacto"
database_id = "1984b793-a347-4c7b-beb5-c21225e01fff"

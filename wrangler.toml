# Binding não herda do topo: a prévia repete a IA e aponta para outro banco, para a bateria
# contra a prévia não gravar no banco de produção.
[env.preview.ai]
binding = "AI"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "formula-de-impacto-previa"
database_id = "32aa2ac6-990c-4737-8ca0-8ae43ff997e7"
migrations_dir = "migrations"
